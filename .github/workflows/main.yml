name: Build Game Solution

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build game
        run: msbuild Game.sln /t:SFMLTemplate /p:Configuration=Release /p:Platform=x64

      - name: Package game
        shell: pwsh
        run: ./package-release.ps1

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: XYZ-Roguelike-windows-x64
          path: release/XYZ-Roguelike.zip
